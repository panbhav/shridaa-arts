<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shridaa Arts | Handmade Lippan Art</title>
  <script>
    // Clean redirect for GitHub Pages routing
    const path = window.location.pathname;
    if (path.includes('/admin')) {
      window.location.replace(path.replace(/\/admin.*$/, '/admin/'));
    } else {
      // Clean root redirect for /home or unknown paths
      const root = path.replace(/\/(home|index\.html)?\/?$/, '/');
      window.location.replace(root);
    }
  </script>
</head>
<body>
  <p>Loading <a href="./">Shridaa Arts</a>...</p>
</body>
</html>
